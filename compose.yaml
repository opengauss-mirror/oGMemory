# See deploy/compose/README_zh.md. Run the deployment entrypoint once before up.
services:
  opengauss:
    image: ${OPENGAUSS_IMAGE:-swr.cn-north-4.myhuaweicloud.com/kunpeng-ai/opengauss-distributed:0328}
    platform: linux/arm64
    privileged: true
    restart: unless-stopped
    environment:
      GS_PASSWORD: ${OG_DB_PASSWORD:-uninitialized}
      GS_USER_PASSWORD: ${OG_DB_PASSWORD:-uninitialized}
    volumes:
      - ${STACK_DIR:-./data/ogmemory}/opengauss:/var/lib/opengauss
    healthcheck:
      test: [CMD-SHELL, "su - omm -c \"gsql -d postgres -p 5432 -c 'SELECT 1;'\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks: [memory]
  ogmemory:
    image: ${OGMEM_IMAGE:-swr.cn-north-4.myhuaweicloud.com/kunpeng-ai/ogmemory:1013}
    platform: linux/arm64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      opengauss:
        condition: service_healthy
        restart: true
    ports:
      - ${PUBLISH_IP:-127.0.0.1}:${OGMEM_HTTP_HOST_PORT:-18090}:8090
      - ${PUBLISH_IP:-127.0.0.1}:${OGMEM_MCP_HOST_PORT:-18091}:8091
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      OGMEM_CONFIG: /etc/ogmem/config.yaml
      OG_ROOT_API_KEY: ${OG_ROOT_API_KEY:-uninitialized}
      OG_TENANT_API_KEY: ${OG_TENANT_API_KEY:-uninitialized}
      OGMEM_MCP_ENABLED: ${OGMEM_MCP_ENABLED:-true}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,opengauss,ogmemory,host.docker.internal,${NO_PROXY:-}
      no_proxy: localhost,127.0.0.1,opengauss,ogmemory,host.docker.internal,${NO_PROXY:-}
    volumes:
      - ${STACK_DIR:-./data/ogmemory}/ogmemory.yaml:/etc/ogmem/config.yaml:ro
      - ${STACK_DIR:-./data/ogmemory}/agfs:/data/agfs
      - ./deploy/compose/scripts:/opt/ogmem-deploy:ro
    healthcheck:
      test: [CMD, python3, /opt/ogmem-deploy/runtime.py, health]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks: [memory]
networks:
  memory:
    driver: bridge

# Structured deployment inputs; config output contains credentials.
x-deployment-inputs:
  DATA_ROOT: ${DATA_ROOT:-./data}
  OGMEM_IMAGE: ${OGMEM_IMAGE:-swr.cn-north-4.myhuaweicloud.com/kunpeng-ai/ogmemory:1013}
  OGMEM_HTTP_HOST_PORT: ${OGMEM_HTTP_HOST_PORT:-18090}
  OGMEM_MCP_HOST_PORT: ${OGMEM_MCP_HOST_PORT:-18091}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  OG_ACCOUNT_ID: ${OG_ACCOUNT_ID:-ogmemory-account}
  OG_USER_ID: ${OG_USER_ID:-ogmemory-user}
  OG_AGENT_ID: ${OG_AGENT_ID:-ogmemory-api-agent}
  OGMEM_AFTER_TURN_THRESHOLD: ${OGMEM_AFTER_TURN_THRESHOLD:-400}
  OGMEM_MCP_ENABLED: ${OGMEM_MCP_ENABLED:-true}
  OGMEM_MCP_ALLOWED_HOSTS: ${OGMEM_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,ogmemory,host.docker.internal}
  STACK_DIR: ${STACK_DIR:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
