[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-engine"
version = "0.1.0"
description = "Long-term memory infrastructure for AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "ContextEngine Team" }
]
keywords = ["ai", "agents", "memory", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "psycopg2-binary>=2.9.0",
    "pyagfs>=1.4.0",
    "openai>=1.66.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "gunicorn>=21.0.0",
    "rich>=13.0.0",
    "httpx[socks]>=0.25.0",
    "requests>=2.28.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.7.0",
    "jsonschema>=4.20.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.9.4",
    "mcp[cli]>=2.0.0,<3",
]

[project.scripts]
ogmem = "cli.main:main"

[project.optional-dependencies]
dev = [
    "hatchling>=1.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    # Used by tests/unit/extraction/operators/test_video_frame_extractor.py.
    # headless build avoids the libgl dependency that opencv-python pulls in
    # on systems without X / display servers.
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.26",
    # Standalone CV inference service (scripts/cv_service.py) and its
    # in-process tests. FastAPI is the framework; uvicorn is only
    # needed when running the service as a real process, but
    # declaring it here keeps the test and dev environments aligned.
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
opengauss = []  # psycopg2-binary now in core dependencies
m3-budget = ["tokenizers>=0.20,<1"]
chroma = ["chromadb>=0.4.0"]
deepagents = ["deepagents>=0.7.23,<0.8"]
sentence-transformers = ["sentence-transformers>=2.0.0"]

# Optional CV backend extras. ``insightface`` is heavy (340MB+ ONNX weights
# downloaded on first use via the configured proxy) and depends on
# ``onnxruntime``. The standalone ``cv_service`` works without it (Haar
# cascade fallback), so this extra is opt-in. When installed, prefer
# ``opencv-python-headless`` over the upstream ``opencv-python`` that
# ``insightface`` declares — headless avoids the ``libgl`` X-server dep
# and keeps ``cv_service.py`` working on headless boxes.
cv = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
]

# Voice ASR stack: Whisper + pyannote diarization + ECAPA-TDNN
# speaker embeddings. Heaviest install in the project — pulls in
# torch (~800 MB), faster-whisper's CTranslate2 runtime, pyannote
# (depends on torch + torchaudio + soundfile), and speechbrain
# (also depends on torch). Keep separate from [cv] so users who
# only need face detection don't pay the torch tax.
#
# Install with: uv pip install -e ".[cv,asr]"
asr = [
    "faster-whisper>=1.0.0",       # CTranslate2 Whisper
    "pyannote.audio>=3.1.0",       # speaker diarization (needs HF token)
    "speechbrain>=0.5.15",         # ECAPA-TDNN speaker embeddings
    "torch>=2.0.0",                # shared by pyannote + speechbrain
    "torchaudio>=2.0.0",
]

# E2E eval dependencies
e2e = [
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
]

# All extras
all = [
    "context-engine[opengauss,chroma,sentence-transformers,cv,asr]",
]

[tool.uv]
# ``insightface`` declares ``opencv-python`` (the libGL-requiring build)
# as a hard dependency, which conflicts with ``opencv-python-headless``
# already used by ``cv_service.py``. We can't easily substitute one for
# the other via PyPI metadata (they're separate packages with the same
# ``cv2`` import), so we suppress the non-headless build via a
# never-true platform marker. The marker removes the requirement from
# resolution entirely, so ``opencv-python`` is never installed when
# resolving ``[cv]`` or ``[all]``. ``opencv-python-headless`` (already
# in ``[dev]``) keeps providing ``cv2``.
override-dependencies = [
    "opencv-python>=999; sys_platform == 'linux'",
]

[project.urls]

Homepage = "https://gitcode.com/opengauss/oGMemory"
Documentation = "https://gitcode.com/opengauss/oGMemory/blob/dev/README.md"
Repository = "https://gitcode.com/opengauss/oGMemory.git"
Issues = "https://gitcode.com/opengauss/oGMemory/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "cli",
    "core",
    "fs",
    "extraction",
    "commit",
    "index",
    "retrieval",
    "providers",
    "service",
    "server",
    "session",
    "skills",
    "features",
    "scene",
    "integrations",
    "m3",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/core",
    "/fs",
    "/extraction",
    "/commit",
    "/index",
    "/retrieval",
    "/providers",
    "/service",
    "/server",
    "/session",
    "/skills",
    "/features",
    "/scene",
    "/integrations",
    "/m3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "integration: marks tests as integration tests (require AGFS or full setup)",
]

[tool.coverage.run]
source = ["core", "fs", "extraction", "commit", "index", "retrieval", "providers", "service", "server"]
omit = ["tests/*"]

# Ruff linting configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["core", "fs", "extraction", "commit", "index", "retrieval", "providers", "service", "server", "integrations"]

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
# 存量目录整体豁免类型检查；被本次 commit 改到的其它文件仍会检查
exclude = "^(tests/|examples/)"
[[tool.mypy.overrides]]
module = "pyagfs.*"
ignore_missing_imports = true

# ---- pre-commit 存量债务集中屏蔽入口（不必改老代码行，避免触发 darker 行级连锁）----
# 示例： "core/legacy.py" = ["E501"]
[tool.ruff.lint.per-file-ignores]

# ---- Bandit：安全扫描（排除测试/示例，避免 assert 等误报）----
[tool.bandit]
exclude_dirs = ["tests", "examples"]
