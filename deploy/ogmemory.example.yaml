# ============================================================
# oGMemory 服务配置文件
# ============================================================
#
# 部署时请复制为 ogmemory.yaml 并修改：
#   cp ogmemory.example.yaml ogmemory.yaml
#
# deploy.sh 会自动将此文件挂载到容器的 /etc/ogmem/config.yaml。
#
# ---- 环境变量引用 ----
# 支持 ${ENV_VAR} 语法引用 deploy.env 中的变量，避免重复配置。
# deploy.sh 会在启动容器前自动替换 ${...} 为实际值。
#
# 示例：
#   api_key: "${LLM_API_KEY}"     → 自动使用 deploy.env 中的 LLM_API_KEY
#   api_key: "sk-xxx"             → 直接使用硬编码值（oGMemory 专用）
#
# 如果 oGMemory 和 OpenClaw 使用相同的 LLM，直接用 ${...} 引用即可；
# 如果 oGMemory 需要不同的 LLM，将对应字段改为硬编码值。
#
# ---- 优先级 ----
# YAML 值 > 环境变量 > 代码默认值
# 未设置的字段会自动回退到对应的环境变量（向后兼容）。
#
# ---- openGauss ----
# 如果启用了 openGauss（deploy.env 中 ENABLE_OPENGAUSS=true），
# deploy.sh 会自动替换 vector_db.connection_string 中的连接信息，
# 无需手动修改 connection_string。
# ============================================================

# ---- LLM 配置 ----
llm:
  provider: "${LLM_PROVIDER}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL}"
  temperature: 0.7
  max_tokens: 4096
  # Per-request timeout, not the entire extraction pipeline deadline.
  request_timeout_seconds: 120
  # Reasoning models consume the output budget before emitting tool arguments.
  # Validate full sessions; e.g. the tested GLM deployment needed max_tokens:
  # 16384 and request_timeout_seconds: 300, not the defaults above.
  # api_key_command:
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/api-key"]

# ---- Embedding 配置 ----
embedding:
  provider: openai                 # 缺省回退到 llm.provider
  model: "text-embedding-v4"
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  multimodal: false                 # 仅火山引擎需设为 true
  # api_key_command:
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/embedding-api-key"]
  # st_model: "BAAI/bge-large-en-v1.5"

# ---- CV 人脸检测 / 人脸特征服务（M3）----
# 默认连接自带 Compose cv 服务的宿主机发布端口；服务需要单独启动：
# docker compose -f deploy/docker-compose.cv.yml up -d --build --wait cv
# 外部 GPU 服务：将 base_url 改为该服务的根地址（不要附加 /detect/faces）。
# 服务必须兼容 POST /detect/faces，图片二进制输入，detections JSON 输出。
# 桥接网络容器若与 cv 在同一网络，使用 http://cv:8081。
# 显式 CLI/pipeline 参数 > 已导出的 OGMEM_CV_SERVICE_URL > 此处配置 > 默认。
cv_service:
  base_url: "http://127.0.0.1:8081"
  timeout_seconds: 30
  # 可选 Bearer token；自带服务不需要认证。不要将真实 token 提交到仓库。
  # auth_token: "${OGMEM_CV_AUTH_TOKEN}"

# ---- Storage Backend ----
# Picks the FS adapter used for context files, grants, outbox, subscriptions, etc.
#   backend: sql   — context data lives in the relational DB (openGauss is PG-wire
#                    compatible and can host these tables alongside the vector
#                    index). Recommended; aligns with the long-term AGFS-removal
#                    direction. The standalone image does not bundle AGFS.
#   backend: agfs  — requires a separately managed AGFS server; openGauss
#                    holds only the vector index. Configure agfs.base_url
#                    for that server if you have an existing AGFS workflow.
#
# The connection string is assembled from STORAGE_DB_* env vars by the
# container entrypoint (see docker/entrypoint-standalone.sh); the ${...}
# references below are the local-run fallback. STORAGE_DB_HOST_PORT is
# the port ogmem actually dials — it is the host port (compose forwards
# this to the postgres container's internal 5432) because the ogmem
# container runs with network_mode: host and can only reach bridge-
# networked siblings via 127.0.0.1:<host_port>.
storage:
  backend: sql
  connection_string: "host=${STORAGE_DB_HOST} port=${STORAGE_DB_HOST_PORT} dbname=${STORAGE_DB_NAME} user=${STORAGE_DB_USER} password=${STORAGE_DB_PASSWORD}"
  pool_size: 5

# ---- 向量数据库 ----
# 连接串由容器 entrypoint 从 VECTOR_DB_* 环境变量拼装并注入（见
# docker/entrypoint-standalone.sh）；${...} 引用是本地直跑时的兜底。
# VECTOR_DB_HOST_PORT is the port ogmem dials — the host port, not the
# openGauss container's internal port (VECTOR_DB_PORT). Same reason as
# STORAGE_DB_HOST_PORT above.
vector_db:
  type: opengauss
  connection_string: "host=${VECTOR_DB_HOST} port=${VECTOR_DB_HOST_PORT} dbname=${VECTOR_DB_NAME} user=${VECTOR_DB_USER} password=${VECTOR_DB_PASSWORD}"
  dimension: 1024
  table_name: vector_index
  pool_size: 5
  # chroma_persist_dir: ".chroma_data"
  # chroma_collection: "contextengine"

# ---- HTTP 服务 ----
service:
  http_port: ${OGMEM_HTTP_PORT}
  workers: 1
  threads: 2
  # http_ip_allowlist: ["127.0.0.1", "10.0.0.0/8"]
  # http_ip_allowlist_trust_proxy: false
  # http_trusted_proxies: ["127.0.0.1"]

# ---- 代码记忆功能（默认关闭）----
features:
  code_resources_enabled: "${OGMEM_CODE_RESOURCES_ENABLED}"
  code_workspace_allowed_roots: "${OGMEM_CODE_WORKSPACE_ALLOWED_ROOTS}"
  code_retrieval_enabled: "${OGMEM_CODE_RETRIEVAL_ENABLED}"
  code_retrieval_semantic_enabled: "${OGMEM_CODE_RETRIEVAL_SEMANTIC_ENABLED}"
  code_retrieval_bm25_enabled: "${OGMEM_CODE_RETRIEVAL_BM25_ENABLED}"
  code_retrieval_symbolic_enabled: "${OGMEM_CODE_RETRIEVAL_SYMBOLIC_ENABLED}"
  code_retrieval_graph_enabled: "${OGMEM_CODE_RETRIEVAL_GRAPH_ENABLED}"
  tool_output_filter:
    enabled: "${OGMEM_TOOL_OUTPUT_FILTER_ENABLED}"
    read_enabled: "${OGMEM_TOOL_OUTPUT_FILTER_READ_ENABLED}"
    bash_enabled: "${OGMEM_TOOL_OUTPUT_FILTER_BASH_ENABLED}"
    adaptive_enabled: "${OGMEM_TOOL_OUTPUT_FILTER_ADAPTIVE_ENABLED}"
    read_min_chars: "${OGMEM_TOOL_OUTPUT_FILTER_READ_MIN_CHARS}"
    read_max_lines: "${OGMEM_TOOL_OUTPUT_FILTER_READ_MAX_LINES}"
    bash_min_chars: "${OGMEM_TOOL_OUTPUT_FILTER_BASH_MIN_CHARS}"
    bash_min_lines: "${OGMEM_TOOL_OUTPUT_FILTER_BASH_MIN_LINES}"
    test_max_lines: "${OGMEM_TOOL_OUTPUT_FILTER_TEST_MAX_LINES}"
    diff_max_lines: "${OGMEM_TOOL_OUTPUT_FILTER_DIFF_MAX_LINES}"
    error_max_lines: "${OGMEM_TOOL_OUTPUT_FILTER_ERROR_MAX_LINES}"
    generic_max_lines: "${OGMEM_TOOL_OUTPUT_FILTER_GENERIC_MAX_LINES}"
    output_max_chars: "${OGMEM_TOOL_OUTPUT_FILTER_OUTPUT_MAX_CHARS}"
    recovery_max_chars: "${OGMEM_TOOL_OUTPUT_FILTER_RECOVERY_MAX_CHARS}"

# ---- MCP 服务（供 OpenClaw / Claude Code / Codex 等直接接入）----
mcp:
  enabled: true
  host: "${OGMEM_MCP_HOST}"
  port: "${OGMEM_MCP_PORT}"
  path: "${OGMEM_MCP_PATH}"
  default_toolset: "${OGMEM_MCP_DEFAULT_TOOLSET}"
  max_sse_connections: "${OGMEM_MCP_MAX_SSE_CONNECTIONS}"
  enable_write_tools: false
  enable_delete_tools: false
  enable_code_edit_tools: "${OGMEM_MCP_ENABLE_CODE_EDIT_TOOLS}"
  allowed_hosts: "${OGMEM_MCP_ALLOWED_HOSTS}"

# ---- Optional external AGFS (unused with storage.backend: sql) ----
agfs:
  base_url: "http://127.0.0.1:1833"
  mount_prefix: "/local/plugin"

# ---- 索引服务 ----
index:
  interval: 15
  workers: 1

# ---- 身份/多租户 ----
identity:
  account_id: "acct-demo"
  user_id: "u-alice"
  agent_id: "main"

# ---- 多租认证 ----
auth:
  role_control_enabled: false
  # root_api_key: "root-secret-key-change-me"
  # admin_api_keys:
  #   - "acct-company-a:admin-key-for-a"
  #   - "acct-company-b:admin-key-for-b"

# ---- Agent 共享 ----
sharing:
  agent_shared_mode: "off"
  # agent_shared_list:
  #   - "agent-shared-sales"
  #   - "agent-shared-support"

# ---- 记忆提取 ----
memory:
  # after_turn_threshold: 200
  # rolling_compress_enabled: true
  # rolling_compress_fallback_enabled: false
  # compact_prepare_token_ttl: 300
  # directory_summary_enabled: false
  # archive_max_count: 10
  # archive_merge_threshold: 10
  # prefetch_enabled: false
  # prefetch_top_k: 5
  # session_state_bridge_enabled: true
  # session_state_sync_interval_turns: 1
  # topic_detection_enabled: false
  # compression_quality_enabled: false
  # compression_quality_persist_metadata: false

# ---- 缓存 ----
cache:
  enabled: true
  max_size: 1000

# ---- Perf 性能监控（可选） ----
# 生命周期阶段性能记录器，详见 perf/README.md。
# 同名 OGMEM_PERF_* 环境变量优先级高于此处的 YAML 值。
# 启用后，OgMemConfig.load() 会将这些值导出为 OGMEM_PERF_* 环境变量，
# 触发 perf.get_recorder() 自动启用。
# perf:
#   enabled: false
#   file_path: "/tmp/ogmem_perf.jsonl"           # 容器内 JSONL 写入路径
#   # http_url: "http://127.0.0.1:8090/api/v1/perf/events"   # 远程 HTTP 上报（与 file_path 二选一）
#   # run_id: "manual-run-2026-05-11"
#   # rate_card: "/etc/ogmem/rate_card.json"

# Agent 工具与经验记忆；开启步骤见 deploy/agent-memory.md。
agent_memory:
  enabled: false

# ---- M3 (M3-Bench) ----
# Per-domain overrides for the M3 video pipeline and QA. Each sub-block is
# merged on top of the corresponding top-level block (llm / embedding), so
# omitting fields here falls back to the service defaults. Used by
# m3.config.load_m3_runtime_config (m3/qa.py, m3/run_video_pipeline.py).
m3:
  # Opt-in bounded QA context. Output reservation comes from qa_llm.max_tokens.
  # Default counter: UTF-8 bytes + framing. Optional local tokenizer needs m3-budget.
  # See docs/m3_bounded_context.md for source-preserving excerpt semantics.
  qa_context:
    enabled: false
    context_window: 32768
    max_input_tokens: 24000
    safety_tokens: 2048
    max_top_k: 16
    max_candidates: 32
    max_result_nodes: 24
    max_search_calls: 8
    max_selected_nodes: 32
    max_passages_per_node: 32
    # tokenizer_path: /path/to/pinned/local/tokenizer.json
    # tokenizer_multiplier: 1.15

  # Multimodal per-clip episodic memory generation.
  episodic_llm:
    provider: "${LLM_PROVIDER}"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL}"
    model: "${LLM_MODEL}"
    temperature: 0.2
    max_tokens: 4096

  # Direct retrieval QA answer model for the vision-only MVP.
  qa_llm:
    provider: "${LLM_PROVIDER}"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL}"
    model: "${LLM_MODEL}"
    temperature: 0.2
    max_tokens: 4096

  # Eval judge (m3.eval). Defaults to MiniMax-M3 via OGMEM_MINIMAX_API_KEY so
  # the bench-scale eval run works without OPENAI_API_KEY. Override
  # provider + base_url + model to point at any OpenAI-compatible endpoint
  # (DeepSeek, vLLM, OpenAI). CLI flags --judge-base-url / --judge-model /
  # --judge-api-key override individual fields per-run.
  judge_llm:
    provider: minimax
    api_key: "${OGMEM_MINIMAX_API_KEY}"
    base_url: "https://api.minimaxi.com/v1"
    model: "MiniMax-M3"
    temperature: 0.0
    max_tokens: 4096

  # Episodic-memory retrieval index embedding. Defaults mirror the top-level
  # embedding block but are explicit so M3 can evolve independently.
  embedding:
    provider: openai
    model: "BAAI/bge-large-zh-v1.5"
    base_url: "${LLM_BASE_URL}"
    api_key: "${LLM_API_KEY}"
    dimension: 1024

  # M3 graph store — where graph_nodes / graph_edges live. Resolves in
  # this order:
  #   1. ``m3.graph_store.connection_string`` (this block, explicit override)
  #   2. ``storage.connection_string``         (default; same DB as the
  #                                            ContextFS / events / grants
  #                                            tables — usually the
  #                                            pgvector Postgres)
  # The legacy fallback to ``vector_db.connection_string`` is **gone**:
  # the graph store and the vector index are separate roles and merging
  # them is what glued M3 to the vector DB through the single-DB
  # topology. If you actually want the graph store on the openGauss
  # cluster (legacy behaviour), set
  # ``m3.graph_store.connection_string`` to the same DSN as
  # ``vector_db.connection_string`` below. CLI drivers also accept
  # ``--connection-string`` for one-off overrides.
  #
  # The default (no entry here) puts graph_nodes / graph_edges on the
  # STORAGE_DB Postgres alongside the rest of the SQL state. That is
  # the recommended topology — graph writes happen in the same DB
  # transaction context as the storage writes they accompany.
  # graph_store:
  #   connection_string: "host=... port=... dbname=... user=... password=..."

  # M3-specific vector-index knobs. The connection string is
  # **inherited from the top-level ``vector_db.connection_string``**
  # above — only the M3 vector index reads it (the graph store does
  # not; see ``m3.graph_store`` above). The M3 VectorIndex and the
  # graph store do NOT have to share a database: in the recommended
  # split topology the graph store sits on STORAGE_DB (Postgres) and
  # the vector index sits on VECTOR_DB (openGauss).
  #
  # ``backend: opengauss`` is the recommended production target;
  # ``pgvector`` is the single-DB convenience alias for PostgreSQL
  # +pgvector deployments that point the vector index at the same
  # Postgres as the graph store (the ``deploy/docker-compose.yml``
  # ``postgres`` service ships the ``pgvector/pgvector:pg16`` image
  # so this works out of the box in dev).
  #
  # Override ``table_name`` if multiple M3 runs share a DB.
  vector_index:
    backend: opengauss
    table_name: m3_episodic_vectors
    pool_size: 5
