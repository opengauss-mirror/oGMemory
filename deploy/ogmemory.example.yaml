# ============================================================
# oGMemory 服务配置文件
# ============================================================
#
# 部署时请复制为 ogmemory.yaml 并修改：
#   cp ogmemory.example.yaml ogmemory.yaml
#
# deploy.sh 会自动将此文件挂载到容器的 /etc/ogmem/config.yaml。
#
# ---- 环境变量引用 ----
# 支持 ${ENV_VAR} 语法引用 deploy.env 中的变量，避免重复配置。
# deploy.sh 会在启动容器前自动替换 ${...} 为实际值。
#
# 示例：
#   api_key: "${LLM_API_KEY}"     → 自动使用 deploy.env 中的 LLM_API_KEY
#   api_key: "sk-xxx"             → 直接使用硬编码值（oGMemory 专用）
#
# 如果 oGMemory 和 OpenClaw 使用相同的 LLM，直接用 ${...} 引用即可；
# 如果 oGMemory 需要不同的 LLM，将对应字段改为硬编码值。
#
# ---- 优先级 ----
# YAML 值 > 环境变量 > 代码默认值
# 未设置的字段会自动回退到对应的环境变量（向后兼容）。
#
# ---- openGauss ----
# 如果启用了 openGauss（deploy.env 中 ENABLE_OPENGAUSS=true），
# deploy.sh 会自动替换 vector_db.connection_string 中的连接信息，
# 无需手动修改 connection_string。
# ============================================================

# ---- LLM 配置 ----
llm:
  provider: "${LLM_PROVIDER}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL}"
  temperature: 0.7
  max_tokens: 4096
  # Per-request timeout, not the entire extraction pipeline deadline.
  request_timeout_seconds: 120
  # Reasoning models consume the output budget before emitting tool arguments.
  # Validate full sessions; e.g. the tested GLM deployment needed max_tokens:
  # 16384 and request_timeout_seconds: 300, not the defaults above.
  # api_key_command:
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/api-key"]

# ---- Embedding 配置 ----
embedding:
  provider: openai                 # 缺省回退到 llm.provider
  model: "text-embedding-v4"
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  # api_key_command:
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/embedding-api-key"]
  # st_model: "BAAI/bge-large-en-v1.5"

# ---- Storage Backend ----
# Picks the FS adapter used for context files, grants, outbox, subscriptions, etc.
#   backend: sql   — context data lives in the relational DB (openGauss is PG-wire
#                    compatible and can host these tables alongside the vector
#                    index). Recommended; aligns with the long-term AGFS-removal
#                    direction. The standalone image does not bundle AGFS.
#   backend: agfs  — requires a separately managed AGFS server; openGauss
#                    holds only the vector index. Configure agfs.base_url
#                    for that server if you have an existing AGFS workflow.
#
# The connection string is assembled from STORAGE_DB_* env vars by the
# container entrypoint (see docker/entrypoint-standalone.sh); the ${...}
# references below are the local-run fallback. STORAGE_DB_HOST_PORT is
# the port ogmem actually dials — it is the host port (compose forwards
# this to the postgres container's internal 5432) because the ogmem
# container runs with network_mode: host and can only reach bridge-
# networked siblings via 127.0.0.1:<host_port>.
storage:
  backend: sql
  connection_string: "host=${STORAGE_DB_HOST} port=${STORAGE_DB_HOST_PORT} dbname=${STORAGE_DB_NAME} user=${STORAGE_DB_USER} password=${STORAGE_DB_PASSWORD}"
  pool_size: 5

# ---- 向量数据库 ----
# 连接串由容器 entrypoint 从 VECTOR_DB_* 环境变量拼装并注入（见
# docker/entrypoint-standalone.sh）；${...} 引用是本地直跑时的兜底。
# VECTOR_DB_HOST_PORT is the port ogmem dials — the host port, not the
# openGauss container's internal port (VECTOR_DB_PORT). Same reason as
# STORAGE_DB_HOST_PORT above.
vector_db:
  type: opengauss
  # Manual Milvus setup: set type: milvus and install .[milvus].
  # Docker onboarding/quickstart also supports Milvus. Embedding dimension must match.
  # milvus_uri: "http://localhost:19530"    # MILVUS_URI
  # milvus_collection: "contextengine"     # MILVUS_COLLECTION
  # milvus_db_name: "default"              # MILVUS_DB_NAME
  # milvus_timeout: 30                     # MILVUS_TIMEOUT (seconds)
  # Supply credentials via MILVUS_TOKEN instead of committing them to YAML.
  connection_string: "host=${VECTOR_DB_HOST} port=${VECTOR_DB_HOST_PORT} dbname=${VECTOR_DB_NAME} user=${VECTOR_DB_USER} password=${VECTOR_DB_PASSWORD}"
  dimension: 1024
  table_name: vector_index
  pool_size: 5
  # chroma_persist_dir: ".chroma_data"
  # chroma_collection: "contextengine"

# ---- HTTP 服务 ----
service:
  http_port: ${OGMEM_HTTP_PORT}
  workers: 1
  threads: 2
  # http_ip_allowlist: ["127.0.0.1", "10.0.0.0/8"]
  # http_ip_allowlist_trust_proxy: false
  # http_trusted_proxies: ["127.0.0.1"]

# ---- MCP 服务（供 OpenClaw / Claude Code / Codex 等直接接入）----
mcp:
  enabled: true
  host: "${OGMEM_MCP_HOST}"
  port: "${OGMEM_MCP_PORT}"
  path: "${OGMEM_MCP_PATH}"
  default_toolset: "${OGMEM_MCP_DEFAULT_TOOLSET}"
  max_sse_connections: "${OGMEM_MCP_MAX_SSE_CONNECTIONS}"
  enable_write_tools: false
  enable_delete_tools: false
  allowed_hosts: "${OGMEM_MCP_ALLOWED_HOSTS}"

# ---- Optional external AGFS (unused with storage.backend: sql) ----
agfs:
  base_url: "http://127.0.0.1:1833"
  mount_prefix: "/local/plugin"

# ---- 索引服务 ----
index:
  interval: 15
  workers: 1

# ---- 身份/多租户 ----
identity:
  account_id: "acct-demo"
  user_id: "u-alice"
  agent_id: "main"

# ---- 多租认证 ----
auth:
  role_control_enabled: false
  # root_api_key: "root-secret-key-change-me"
  # admin_api_keys:
  #   - "acct-company-a:admin-key-for-a"
  #   - "acct-company-b:admin-key-for-b"

# ---- Agent 共享 ----
sharing:
  agent_shared_mode: "off"
  # agent_shared_list:
  #   - "agent-shared-sales"
  #   - "agent-shared-support"

# ---- 记忆提取 ----
memory:
  # after_turn_threshold: 400
  # rolling_compress_enabled: true
  # rolling_compress_fallback_enabled: false
  # compact_prepare_token_ttl: 300
  # directory_summary_enabled: false
  # archive_max_count: 10
  # archive_merge_threshold: 10
  # prefetch_enabled: false
  # prefetch_top_k: 5
  # session_state_bridge_enabled: true
  # session_state_sync_interval_turns: 1
  # topic_detection_enabled: false
  # compression_quality_enabled: false
  # compression_quality_persist_metadata: false

# ---- 缓存 ----
cache:
  enabled: true
  max_size: 1000

# ---- Perf 性能监控（可选） ----
# 生命周期阶段性能记录器，详见 perf/README.md。
# 同名 OGMEM_PERF_* 环境变量优先级高于此处的 YAML 值。
# 启用后，OgMemConfig.load() 会将这些值导出为 OGMEM_PERF_* 环境变量，
# 触发 perf.get_recorder() 自动启用。
# perf:
#   enabled: false
#   file_path: "/tmp/ogmem_perf.jsonl"           # 容器内 JSONL 写入路径
#   # http_url: "http://127.0.0.1:8090/api/v1/perf/events"   # 远程 HTTP 上报（与 file_path 二选一）
#   # run_id: "manual-run-2026-05-11"
#   # rate_card: "/etc/ogmem/rate_card.json"

# Agent 工具与经验记忆；开启步骤见 deploy/agent-memory.md。
agent_memory:
  enabled: false
