# ============================================================================
# oGMemory — M3-Bench runner runtime config (WS 1.4)
# ============================================================================
#
# Consumed by the m3 pipeline drivers (m3/config.py::load_m3_runtime_config)
# inside the `m3runner` compose service, which mounts this file at
# /etc/ogmem/config.yaml and exports OGMEM_CONFIG=/etc/ogmem/config.yaml.
#
# Placeholder style: whole-string `${VAR}` refs — exactly what
# m3.config._expand_env_ref resolves against the process environment
# (unlike the serving ogmemory.yaml, whose inline DSN refs are rendered by
# the serving entrypoint, the m3 drivers do NOT run an entrypoint render).
# Compose wires those vars in docker-compose.yml (m3runner service):
#
#   M3_STORAGE_DSN / M3_VECTOR_DSN   full DSNs built from STORAGE_DB_* /
#                                    VECTOR_DB_* — keep single-DB deployments
#                                    pointing both at the same Postgres.
#   M3_EMBED_API_KEY                 embedder bearer token
#   LLM_PROVIDER / LLM_API_KEY / LLM_BASE_URL / LLM_MODEL
#
# Outside compose, either export them yourself or pass --connection-string
# / --judge-model etc. on the CLI (explicit flags win).
#
# Topology note (this repo's single-DB mode): the graph store
# (graph_nodes/graph_edges) and everything else SQL live on the STORAGE_DB
# Postgres; the vector index lives in the same instance (pgvector) but in
# its own table (`m3_episodic_vectors`). OpenGaussVectorIndex's SQL is
# pgvector-compatible, so only the label differs.

llm:
  provider: "${LLM_PROVIDER}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL}"
  temperature: 0.7
  # Reasoning models (deepseek-r*-style) emit reasoning_content and burn
  # several thousand tokens before the answer; a small budget truncates
  # tool calls mid-flight (finish_reason=length → hard extraction
  # failures). Keep this large.
  max_tokens: 32768
  request_timeout_seconds: 120

embedding:
  provider: openai
  model: "Qwen/Qwen3-Embedding-0.6B"
  base_url: "http://127.0.0.1:8000/v1"   # note the /v1 — the SDK appends /embeddings
  api_key: "${M3_EMBED_API_KEY}"
  multimodal: false
  # MUST equal vector_db.dimension below (sync both if you swap embedders;
  # openGauss HNSW caps at 2000 dims).
  dimension: 1024

storage:
  backend: sql
  # Whole-string ${VAR} refs only — see the header note. This is also the
  # default graph-store DSN (m3.graph_store.connection_string overrides).
  connection_string: "${M3_STORAGE_DSN}"
  pool_size: 5

vector_db:
  type: opengauss
  connection_string: "${M3_VECTOR_DSN}"
  dimension: 1024
  table_name: vector_index
  pool_size: 5

# M3 bench identity — one dedicated account so runs are isolated and
# wipe_stages can reset them (m3/wipe_stages.py is account-scoped).
identity:
  account_id: "m3bench"
  user_id: "m3bench-user"
  agent_id: "m3bench-agent"

m3:
  # Per-role LLM blocks: empty = inherit the top-level llm block above.
  # Override a role (e.g. a cheap judge) like:
  #   judge_llm:
  #     provider: openai
  #     model: deepseek-v4.1-flash
  #     base_url: "https://ark.volces.com/api/v3"
  #     api_key: "${M3_JUDGE_API_KEY}"
  #     temperature: 0.0
  episodic_llm: {}
  qa_llm: {}
  judge_llm: {}

  # M3-specific vector index knobs. `backend: pgvector` selects the
  # pgvector-compatible SQL path (works on both PG+pgvector and openGauss;
  # the code path is OpenGaussVectorIndex either way).
  vector_index:
    table_name: m3_episodic_vectors
    backend: pgvector
    # Env wins over YAML: OGMEM_VECTOR_POOL_SIZE. Keep pool_size >= the
    # parallel worker count (OGMEM_M3_MAX_WORKERS).
    pool_size: 8
