# External Milvus service; its endpoint and credentials belong in ogmemory.yaml/env.
services:
  ogmemory:
    image: ${OGMEM_MILVUS_IMAGE:-ogmemory-milvus:dev}
    build:
      context: ../..
      dockerfile: deploy/milvus/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${OGMEM_HTTP_HOST_PORT:-18092}:8090"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      OGMEM_CONFIG: /etc/ogmem/config.yaml
      OGMEM_API_KEY: ${OGMEM_API_KEY:-}
      OG_ROOT_API_KEY: ${OG_ROOT_API_KEY:-}
      OG_ADMIN_API_KEYS: ${OG_ADMIN_API_KEYS:-}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal,${NO_PROXY:-}
    volumes:
      - ${OGMEM_MILVUS_CONFIG:-./ogmemory.yaml}:/etc/ogmem/config.yaml:ro
      - ${OGMEM_MILVUS_DATA:-./data}:/data/agfs
    networks: [milvus-client]
networks:
  milvus-client:
    ipam:
      config:
        - subnet: ${OGMEM_MILVUS_SUBNET:-10.253.255.0/28}
