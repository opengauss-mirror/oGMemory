<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>memoryBot · 长期记忆工作助手</title>
  <link rel="stylesheet" href="/memory-viewer/theme.css">
  <link rel="stylesheet" href="/bot/static/app.css">
  <script src="/bot/static/marked.umd.js" defer></script><script src="/bot/static/purify.min.js" defer></script><script src="/bot/static/app.js" defer></script>
</head>
<body>
  <button id="sidebar-backdrop" class="sidebar-backdrop" data-action="close-sidebar" aria-label="关闭会话列表" hidden></button>
  <aside id="session-sidebar" class="sidebar" aria-label="会话与功能">
    <div class="sidebar-brand"><a class="brand" href="/bot"><span data-icon="bot"></span><span>memoryBot</span></a><button class="icon-button mobile-only" data-action="close-sidebar" aria-label="关闭会话列表"><span data-icon="close"></span></button></div>
    <button class="new-session" data-action="new-session"><span data-icon="plus"></span>新建会话</button>
    <nav class="navigation" aria-label="功能"><button data-page="chat" class="active" aria-current="page"><span data-icon="chat"></span>对话</button><button data-page="files"><span data-icon="file"></span>资料</button><button data-page="plans"><span data-icon="clock"></span>计划</button><button data-page="memories"><span data-icon="memory"></span>记忆</button></nav>
    <label class="session-search"><span data-icon="search"></span><input id="session-search" type="search" placeholder="搜索会话" aria-label="搜索会话"><button id="clear-session-search" type="button" class="icon-button" aria-label="清除会话搜索" hidden>×</button></label>
    <div class="sidebar-label"><select id="session-filter" aria-label="会话筛选"><option value="false">最近会话</option><option value="true">已归档</option></select><button class="icon-button" data-action="refresh-sessions" aria-label="刷新会话"><span data-icon="refresh"></span></button></div>
    <div id="session-list" class="session-list" aria-label="会话列表"></div><button id="session-more" class="subtle sidebar-more" data-action="more-sessions" hidden>加载更多</button>
    <div class="sidebar-footer"><span id="connection-dot" class="connection-dot"></span><span id="connection-label">连接工作空间</span><button class="icon-button" data-action="connect" aria-label="连接设置"><span data-icon="settings"></span></button></div>
  </aside>
  <main>
    <header class="topbar"><button class="secondary mobile-only" data-action="open-sidebar" aria-controls="session-sidebar" aria-expanded="false"><span data-icon="panel"></span>会话</button><h1 id="page-title">新会话</h1><div class="topbar-actions"><label id="agent-picker" class="agent-picker">Agent<select id="chat-agent" aria-label="会话 Agent"></select></label><button id="session-settings" class="icon-button" data-action="session-settings" aria-label="会话设置" title="会话设置"><span data-icon="more"></span></button><button class="icon-button standalone-control" data-action="connect" aria-label="连接设置"><span data-icon="settings"></span></button></div></header>
    <div id="status-banner" class="status-banner" role="status" hidden></div>
    <section id="page-chat" class="page chat-page" aria-label="对话">
      <div id="chat-scroll" class="chat-scroll"><div class="chat-content"><button id="history-more" class="subtle history-more" data-action="more-history" hidden>查看更早消息</button>
        <div id="welcome" class="welcome"><span class="welcome-symbol" data-icon="bot"></span><h2>开始一段对话</h2><p>检索记忆、整理资料，或安排下一步。</p><div class="suggestions"><button data-action="suggest" data-text="回顾上次讨论的内容，整理下一步。"><span data-icon="chat"></span>接续上次讨论</button><button data-action="suggest" data-text="根据已上传资料，整理本周进展和待办。"><span data-icon="file"></span>整理周报</button><button data-action="suggest" data-text="请帮我安排一个提醒。"><span data-icon="clock"></span>安排提醒</button></div></div>
        <div id="conversation" class="conversation" aria-live="polite" aria-label="会话消息"></div>
      </div></div>
      <div class="composer-dock"><button id="jump-latest" class="secondary jump-latest" data-action="jump-latest" hidden><span data-icon="down"></span>最新消息</button><form novalidate id="composer" class="composer"><div id="attachments" class="attachments"></div><label class="sr-only" for="message">发送消息</label><textarea id="message" name="text" rows="2" placeholder="提问，或描述要整理的内容…" maxlength="32768"></textarea><div class="composer-toolbar"><div class="composer-tools"><button type="button" class="icon-button" data-action="upload" aria-label="添加资料" title="添加资料"><span data-icon="plus"></span></button><button type="button" class="subtle" data-action="toggle-options" aria-expanded="false" aria-controls="composer-options"><span data-icon="sliders"></span>生成设置</button><span id="composer-mode" class="composer-mode"></span></div><button id="stop-button" type="button" class="primary stop-button" data-action="stop-current" aria-label="停止生成" hidden><span data-icon="stop"></span>停止</button><button id="send-button" type="submit" class="primary send-button" aria-label="发送消息"><span data-icon="up"></span></button></div><div id="composer-options" class="composer-options" hidden><label>模板<select id="chat-template" aria-label="任务模板"><option value="">自由对话</option></select></label><label hidden>成果格式<select id="chat-format" aria-label="成果格式"><option value="markdown">Markdown</option></select></label><p id="template-description" class="template-description">选择模板可生成周报、交接稿等成果，结果会显示在当前会话。</p></div></form><p class="composer-hint">Enter 发送 · Shift + Enter 换行</p></div>
    </section>
    <section id="page-files" class="page" hidden aria-label="资料与成果"><div class="section-head"><div><h2>资料与成果</h2><p>上传资料用于问答，生成的成果可继续修订。</p></div><div class="actions"><button class="secondary" data-action="add-url">收录网页</button><button class="primary" data-action="upload">上传资料</button></div></div><div class="filter-row"><label>用途 <select id="file-filter"><option value="">全部</option><option value="source">资料</option><option value="artifact">成果</option></select></label></div><div class="browse-meta"><span id="files-count" class="collection-count">资料与成果列表</span><span id="files-loading" class="collection-loading" role="status" hidden>正在加载…</span></div><div id="file-list" class="card-grid browse-list" aria-label="资料与成果列表"></div><button id="files-more" class="secondary load-more" data-action="more-files" hidden>加载更多</button></section>
    <section id="page-plans" class="page" hidden aria-label="计划"><div class="section-head"><div><h2>计划</h2><p>管理提醒和周期任务，执行结果保存在对应会话。</p></div><button class="primary" data-action="new-plan">新建计划</button></div><div class="browse-meta"><span id="plans-count" class="collection-count">计划列表</span><span id="plans-loading" class="collection-loading" role="status" hidden>正在加载…</span></div><div id="plan-list" class="card-grid browse-list" aria-label="计划列表"></div><button id="plans-more" class="secondary load-more" data-action="more-plans" hidden>加载更多</button></section>
    <section id="page-memories" class="page" hidden aria-label="记忆"><div class="section-head"><div><h2>记忆</h2><p>查看已授权记忆及其来源，更正事实或遗忘条目。</p></div><button class="primary" data-action="remember">记住信息</button></div><form novalidate id="memory-search" class="search-form"><label class="memory-scope-label">浏览范围<select id="memory-scope" aria-label="记忆浏览范围"><option value="user">我的记忆</option><option value="authorized">全部已授权记忆</option></select></label><input id="memory-query" placeholder="搜索事实、偏好、决定…" aria-label="记忆关键词"><button id="clear-memory-query" type="button" class="subtle" aria-label="清除记忆搜索" hidden>清除</button><button class="secondary" type="submit">查询</button></form><p id="memory-results-label" class="memory-results-label" role="status"></p><div class="browse-meta"><span id="memories-count" class="collection-count">记忆列表</span><span id="memories-loading" class="collection-loading" role="status" hidden>正在加载…</span></div><div id="memory-list" class="card-grid browse-list" aria-label="记忆列表"></div><button id="memories-more" class="secondary load-more" data-action="more-memories" hidden>加载更多</button></section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" data-action="close-dialog" aria-label="关闭"><span data-icon="close"></span></button></div><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
