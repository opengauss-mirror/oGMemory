<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">memoryBot首次多实例部署</title>
  <desc id="desc">用户从Web或CLI进入负载均衡，由两个Bot接入实例受理。两个Bot执行实例从共享数据库领取任务，在各自进程内复用原生会话、检索、技能与记忆写入能力，处理对话、资料和计划。记忆写入使用稳定请求、持久检查点和数据库身份锁。会话、任务、步骤、计划及记忆数据保存在共享数据库，资料与成果保存在共享文件存储，模型服务提供生成、提取和向量化能力。切换Bot实例后可以继续任务。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#3b82f6"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
      .heading { font-size: 21px; font-weight: 700; fill: #12243d; }
      .body { font-size: 17px; fill: #52627a; }
      .small { font-size: 15px; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="720" rx="20" fill="#f8fafc"/>
  <g transform="translate(0 -90)">
  <rect x="40" y="113" width="185" height="78" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="132" y="145" text-anchor="middle" class="heading">用户</text>
  <text x="132" y="174" text-anchor="middle" class="body">Web · CLI</text>
  <path d="M225 152H257" class="arrow"/>
  <rect x="265" y="123" width="160" height="58" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="345" y="160" text-anchor="middle" class="heading">负载均衡</text>
  <path d="M425 152H445V137H457" class="arrow"/>
  <path d="M445 152V219H457" class="arrow"/>

  <rect x="465" y="106" width="220" height="62" rx="14" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="575" y="145" text-anchor="middle" class="heading">Bot 接入实例 1</text>
  <rect x="465" y="188" width="220" height="62" rx="14" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="575" y="227" text-anchor="middle" class="heading">Bot 接入实例 2</text>
  <path d="M685 137H1080V610" class="line"/>
  <path d="M685 219H1080" class="line"/>
  <text x="840" y="204" class="small">受理与查询会话、任务</text>

  <rect x="40" y="227" width="185" height="64" rx="14" fill="#fff5e6" stroke="#f1d5a5"/>
  <text x="132" y="253" text-anchor="middle" font-size="19" font-weight="700" fill="#946014">模型服务</text>
  <text x="132" y="278" text-anchor="middle" class="small">外部依赖</text>
  <path d="M200 335V299" class="arrow"/>
  <text x="220" y="321" class="small">模型调用</text>

  <rect x="40" y="335" width="660" height="225" rx="18" fill="#eff6ff" stroke="#c9dcf5"/>
  <text x="64" y="367" font-size="21" font-weight="700" fill="#1e4f91">Bot 执行实例：处理各类工作</text>
  <rect x="65" y="386" width="295" height="150" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="212" y="417" text-anchor="middle" class="heading">执行实例 1</text>
  <text x="212" y="445" text-anchor="middle" font-size="16" fill="#52627a">对话 · 资料处理 · 计划任务</text>
  <rect x="85" y="460" width="255" height="57" rx="10" fill="#e8f8f0"/>
  <text x="212" y="482" text-anchor="middle" class="small">进程内复用</text>
  <text x="212" y="506" text-anchor="middle" font-size="19" font-weight="700" fill="#16845c">现有检索与技能能力</text>
  <rect x="380" y="386" width="295" height="150" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="527" y="417" text-anchor="middle" class="heading">执行实例 2</text>
  <text x="527" y="445" text-anchor="middle" font-size="16" fill="#52627a">对话 · 资料处理 · 计划任务</text>
  <rect x="400" y="460" width="255" height="57" rx="10" fill="#e8f8f0"/>
  <text x="527" y="482" text-anchor="middle" class="small">进程内复用</text>
  <text x="527" y="506" text-anchor="middle" font-size="19" font-weight="700" fill="#16845c">现有检索与技能能力</text>

  <rect x="760" y="335" width="300" height="225" rx="18" fill="#f0faf5" stroke="#c1e7d3"/>
  <text x="910" y="367" text-anchor="middle" font-size="21" font-weight="700" fill="#21754d">进程内复用原生能力</text>
  <rect x="785" y="386" width="250" height="44" rx="11" fill="#ffffff" stroke="#c1e7d3"/>
  <text x="910" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#12243d">会话上下文与记忆检索</text>
  <rect x="785" y="441" width="250" height="44" rx="11" fill="#ffffff" stroke="#c1e7d3"/>
  <text x="910" y="470" text-anchor="middle" font-size="20" font-weight="700" fill="#12243d">身份权限与技能读取</text>
  <rect x="785" y="496" width="250" height="52" rx="11" fill="#e8f8f0" stroke="#8acaa8"/>
  <text x="910" y="519" text-anchor="middle" font-size="19" font-weight="700" fill="#21754d">复用记忆写入能力</text>
  <text x="910" y="539" text-anchor="middle" font-size="13" fill="#52627a">身份锁 ＋ 持久检查点</text>
  <path d="M700 522H777" class="arrow"/>
  <text x="742" y="489" text-anchor="middle" font-size="13" fill="#52627a">原生调用</text>
  <text x="742" y="507" text-anchor="middle" font-size="13" fill="#64748b">稳定请求</text>

  <path d="M212 560V610H1080" class="line"/>
  <path d="M910 560V610" class="line"/>
  <path d="M527 560V610" class="line"/>
  <circle cx="527" cy="610" r="3.5" fill="#64748b"/>
  <circle cx="910" cy="610" r="3.5" fill="#64748b"/>
  <path d="M420 610V642" class="arrow"/>
  <circle cx="420" cy="610" r="3.5" fill="#64748b"/>
  <rect x="259" y="575" width="222" height="29" rx="14" fill="#f8fafc"/>
  <text x="370" y="596" text-anchor="middle" class="small">领取任务 · 保存步骤</text>
  <rect x="850" y="575" width="120" height="29" rx="14" fill="#f8fafc"/>
  <text x="910" y="596" text-anchor="middle" class="small">读写记忆</text>

  <rect x="40" y="650" width="640" height="138" rx="18" fill="#eaf2ff" stroke="#9fc3f5" stroke-width="1.5"/>
  <text x="70" y="688" font-size="24" font-weight="700" fill="#1e4f91">openGauss</text>
  <text x="276" y="687" font-size="17" fill="#52627a">共享表、记忆正文与文件元信息</text>
  <text x="70" y="726" font-size="20" fill="#12243d">会话 · 任务 · 步骤 · 计划</text>
  <text x="70" y="760" class="body">记忆正文 · 关系 · 索引</text>
  <path d="M680 718H752" class="arrow"/>
  <text x="720" y="705" text-anchor="middle" font-size="13" fill="#64748b">文件引用</text>
  <rect x="760" y="650" width="300" height="138" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="910" y="688" text-anchor="middle" font-size="23" font-weight="700" fill="#12243d">AGFS 文件服务</text>
  <text x="910" y="726" text-anchor="middle" font-size="20" fill="#12243d">资料 · 成果文件</text>
  <text x="910" y="760" text-anchor="middle" class="small">底层：对象存储／共享卷</text>

  </g>
</svg>
