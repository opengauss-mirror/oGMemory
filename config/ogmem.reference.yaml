# ============================================================
# oGMemory Unified Configuration Reference
# ============================================================
#
# This is the single reference template for all deployment modes.
# Copy and edit for your use case:
#
#   Local dev:  cp config/ogmem.reference.yaml ogmem.yaml
#   Docker:     cp config/ogmem.reference.yaml deploy/ogmemory.yaml
#
# Mode annotations:
#   [all]     — applies to all modes
#   [local]   — local development only
#   [docker]  — Docker deployment (uses ${ENV_VAR} from deploy.env)
#
# Priority: YAML value > env var > code default
# ============================================================

# ---- LLM Configuration [all] ----
llm:
  provider: openai                # [all] mock / openai / openai-cached
  api_key: "your-api-key"        # [local] your key; [docker] use "${LLM_API_KEY}"
  # api_key_command:             # [all] 1Password / vault integration
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/api-key"]
  base_url: "https://api.openai.com/v1"  # [local] your endpoint; [docker] use "${LLM_BASE_URL}"
  model: "gpt-4o-mini"           # [local] your model; [docker] use "${LLM_MODEL}"
  temperature: 0.1               # [all] recommended: 0-0.1 for deterministic extraction
  max_tokens: 4096               # [all]
  json_mode: false               # [all]
  # reasoning_effort: "medium"  # [all] optional; sent only when configured
  # is_reasoning_model: true     # [all] optional override; null means auto-detect
  # extra_body:                  # [all] arbitrary OpenAI-compatible provider options
  #   thinking: {type: enabled}

# ---- Embedding Configuration [all] ----
embedding:
  # provider: null               # [all] defaults to llm.provider
  model: "text-embedding-v4"     # [all]
  base_url: "https://api.openai.com/v1"  # [all] defaults to llm.base_url
  api_key: null                  # [all] defaults to llm.api_key
  # api_key_command:
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/embedding-api-key"]
  multimodal: false              # [all] true for VolcEngine /doubao embeddings
  # st_model: "BAAI/bge-m3"     # [local] Sentence Transformer local model (overrides API embedding)

# ---- Vector Database [all] ----
vector_db:
  type: chroma                   # [local] memory (quickstart) / chroma / opengauss
                                  # [docker] opengauss (recommended for production)
  # --- Chroma (local) ---
  chroma_persist_dir: ".ogmem_data/chroma"  # [local]
  # chroma_collection: "contextengine"
  # --- OpenGauss (docker / production) ---
  # connection_string: "host=127.0.0.1 port=8799 dbname=postgres user=gaussdb password=CHANGE_ME"
  dimension: 1024                # [all]
  table_name: vector_index       # [all]
  pool_size: 5                   # [all]

# ---- HTTP Service [all] ----
service:
  http_port: 8090                # [all]
  workers: 2                     # [all]
  # http_ip_allowlist: ["127.0.0.1", "10.0.0.0/8"]  # [all]
  # http_ip_allowlist_trust_proxy: false              # [all]
  # http_trusted_proxies: ["127.0.0.1"]               # [all]

# ---- Code Memory Features [all, opt-in] ----
features:
  code_resources_enabled: false
  code_resources_max_files: 5000
  # Empty fails closed: local workspace registration is permitted only below
  # canonical directories configured here. Do not use / as an allowed root.
  code_workspace_allowed_roots: []
  # Workspace sync is separate from direct code-resource operations and remains
  # disabled by default. It requires code_resources_enabled: true.
  code_sync_enabled: false
  code_sync_default_trigger_mode: hybrid  # hybrid / manual / external_event
  code_sync_default_wait_mode: accepted  # accepted / filesystem_complete / index_visible
  code_sync_reconcile_interval_seconds: 300
  code_sync_watch_interval_seconds: 5
  code_sync_run_timeout_seconds: 60
  code_sync_failure_backoff_seconds: 30
  code_sync_max_pending_roots: 100
  code_sync_debounce_seconds: 2
  code_retrieval_enabled: false
  # Process-static mode; restart the service after changing it.
  # full keeps the imported/persistent code index path. candidate_local uses
  # only one registered root and request-local candidate vectors.
  # Prefer the nested `code_retrieval.mode` below. The legacy flat
  # `code_retrieval_mode` form is also accepted, but do not set both.
  code_retrieval_semantic_enabled: true
  code_retrieval_bm25_enabled: true
  code_retrieval_symbolic_enabled: true
  code_retrieval_graph_enabled: true
  code_retrieval:
    mode: full  # full / candidate_local
    fusion_mode: weighted_rrf  # weighted_rrf / weighted_sum / sum
    semantic_weight: 0.33
    bm25_weight: 0.17
    symbolic_weight: 0.17
    graph_weight: 0.33
    candidate_limit: 50
    result_limit: 5
    snippet_chars: 1200
    batch_chars: 8000
    graph_neighbor_limit: 24
    route_deadline_ms: 500
    candidate_discovery_pool_limit: 300
    candidate_file_limit: 80
    candidate_snippet_limit: 500
    candidate_semantic_limit: 16
    candidate_embedding_chars: 4096
    candidate_embedding_batch_texts: 8
    candidate_embedding_batch_tokens: 8000
    candidate_read_bytes: 67108864
    candidate_discovery_deadline_ms: 15000
    candidate_embedding_deadline_ms: 330000
    candidate_request_deadline_ms: 360000
  tool_output_filter:
    enabled: false
    read_enabled: true
    bash_enabled: true
    adaptive_enabled: true
    read_min_chars: 8000
    read_max_lines: 60
    bash_min_chars: 8000
    bash_min_lines: 100
    test_max_lines: 120
    diff_max_lines: 100
    error_max_lines: 100
    generic_max_lines: 80
    output_max_chars: 50000
    recovery_max_chars: 50000

# ---- MCP Server [all] ----
mcp:
  enabled: true
  host: "127.0.0.1"
  port: 8091
  path: "/mcp"
  default_toolset: "read-only"
  enable_write_tools: false
  enable_delete_tools: false
  enable_runtime_tools: false
  enable_diagnostic_tools: false
  enable_code_edit_tools: false
  max_request_bytes: 1048576
  max_sse_connections: 64
  max_response_chars: 50000
  collection_limit: 50
  allowed_origins: []
  allowed_hosts: ["127.0.0.1", "localhost"]

# ---- Storage Backend [all] ----
storage:
  backend: sql                   # [all] agfs / sql (recommended: sql)
  dialect: postgresql            # [all] postgresql / opengauss
  connection_string: "host=127.0.0.1 port=5432 dbname=ogmemory user=postgres password=postgres"  # [local]
  pool_size: 5                   # [all]
  trace_max_turn_events: 128     # [all] first + newest events retained per finalized turn (2-1024)

# ---- Paths [local] ----
paths:
  data_root: .ogmem_data         # [local] all runtime data (chroma/, agfs/, logs/)

# ---- AGFS (internal) [docker] ----
agfs:
  base_url: "http://127.0.0.1:1833"   # [all] AGFS server address
  mount_prefix: "/local/plugin"        # [docker]

# ---- Index Service [all] ----
index:
  interval: 15                   # [all] polling interval (seconds)
  workers: 1                     # [all]

# ---- Identity / Multi-tenant [all] ----
identity:
  account_id: "acct-demo"        # [all]
  user_id: "u-alice"             # [all]
  agent_id: "main"               # [all]

# ---- Authentication [all] ----
auth:
  role_control_enabled: false    # [all] enable for multi-tenant
  # root_api_key: "root-secret-key-change-me"     # [all]
  # admin_api_keys:                                # [all]
  #   - "acct-company-a:admin-key-for-a"
  #   - "acct-company-b:admin-key-for-b"

# ---- Agent Sharing [all] ----
sharing:
  agent_shared_mode: "off"       # [all] off / user
  # agent_shared_list:           # [all]
  #   - "agent-shared-sales"
  #   - "agent-shared-support"

# ---- Memory Extraction [all] ----
memory:
  extraction:
    card_format_enabled: false  # Validate entity/preference cards and recover malformed output in background.
    mode: eager                   # [all] eager / lazy (lazy = ReAct loop with read tools)
    node_processing_enabled: false # [all] eager or lazy extraction followed by topic node processing
    dual_pass_enabled: true       # [all] Run two native extraction passes per span
  # after_turn_threshold: 400    # [all] tokens before auto-extraction
  # rolling_compress_enabled: true
  # compact_prepare_token_ttl: 300
  # directory_summary_enabled: false
  # prefetch_enabled: false
  # prefetch_top_k: 5
  # session_state_bridge_enabled: true
  # session_state_sync_interval_turns: 1
  # topic_detection_enabled: false
  # compression_quality_enabled: false
  # compression_quality_persist_metadata: false

# ---- Large Tool-result Externalization [all, opt-in] ----
tool_result_externalization:
  enabled: false
  # When the host exposes a trusted post-tool/pre-model middleware, replace a
  # qualifying result before its first model request. Disable to retain the
  # legacy afterTurn-only lifecycle without disabling Artifact/recall support.
  first_view_enabled: true
  # Current lifecycle contract: one complete user message is one semantic Turn.
  # The option remains explicit so future verified lifecycles can extend it.
  semantic_turn_mode: user_message  # currently the only supported value
  single_result_chars: 20000
  synopsis_max_chars: 2000
  # synopsis, key_facts, selected_evidence, retained_records and coverage share
  # synopsis_max_chars, except unique critical records may exceed it.
  # The Turn budget applies that combined summary across all stubs in one Turn.
  stub_summary_turn_chars: 12000
  write_timeout_ms: 3000
  retry_attempts: 2
  search_chunk_bytes: 16384
  search_overlap_bytes: 1024
  search_top_k: 5
  search_max_artifacts: 20
  search_deadline_ms: 2000
  read_default_bytes: 32768
  artifact_temp_grace_seconds: 600
  http_max_response_chars: 100000

# ---- Tool-result Cache Delay [opt-in] ----
tool_result_optimization:
  cache_delay:
    enabled: false
    delayed_result_chars: 2000
    idle_ttl_seconds: 300
    # Observability/cost-planning input only; it is not a correctness gate.
    cache_hit_price_ratio: 0.1

# ---- Agent Skill Sedimentation [AGFS or SQL, opt-in] ----
# AGFS sedimentation currently supports one oGMemory service process.
# SQL remains required for coordinated processing across multiple instances.
# Set service.workers: 1 when enabling it with storage.backend: agfs.
skills:
  sedimentation:
    enabled: false
    # Generate Example IR from the first successful trace and render it in SKILL.md.
    worked_examples_enabled: false
    # Skill-first: each high-quality trace may create or update a reviewed skill.
    min_evidence_turns: 1
    min_distinct_sessions: 1
    turn_score_threshold: 0.85
    publish_score_threshold: 0.90
    semantic_update_threshold: 0.92
    semantic_hold_threshold: 0.80
    scan_interval_seconds: 60
    lease_seconds: 300
    max_attempts: 5
    candidate_limit: 200
    catalog_scan_limit: 10000
    max_evidence_turns: 20
    max_trace_chars: 32768
    max_prompt_chars: 65536
    retry_base_seconds: 30
    retry_cap_seconds: 3600
    batch_size: 20
    account_workers: 2
    search_scan_limit: 1000
    # Trace hooks must set OGMEM_TRACE_CAPTURE_CONTENT=1. Turns without
    # non-empty user and assistant content are rejected before any LLM call.
    # reviewer_provider: openai
    # reviewer_model: gpt-4o-mini
    # sync_target: ~/.agents/skills

# ---- Retrieval [all] ----
retrieval:
  # Service-instance setting; restart every worker after changing it.
  # false searches only L2 without roots, hierarchical expansion, or child
  # searches, including empty-result fallbacks. Existing ranking and public
  # URI/read behavior apply; results discovered through L0/L1 may be lost.
  # Priority: this YAML value > OGMEM_RETRIEVAL_EXPAND_HIERARCHY > true.
  expand_hierarchy: true
  # Hybrid retrieval [openGauss + SQL canonical storage, opt-in]: requires
  # the openGauss BM25 access method and <&> operator. The configured database
  # role must be able to create/alter the versioned lexical tables, indexes,
  # and generation sequence. Rolling mixed-version workers are unsupported:
  # upgrade and stop every old vector-only outbox worker before enabling this
  # flag, and do not start one while hybrid is enabled. Historical rebuilds
  # stream bounded pages in one background worker; the first read per owner
  # scope fails closed until ready.
  hybrid_enabled: false
  vector_top_k: 100
  lexical_top_k: 50
  rrf_k: 60
  semantic_weight: 1.0
  lexical_weight: 1.0
  backfill_page_size: 500
  lexical:
    provider: opengauss_native
    options:
      # Projection/checkpoint tables use opengauss_connection_string (or the
      # vector openGauss DSN); canonical outbox state gates reads fail-closed.
      table_name: lexical_index_opengauss_native
      query_timeout_ms: 5000
      max_query_chars: 32768

# ---- Cache [all] ----
agent_memory:
  enabled: false                # OGMEM_AGENT_MEMORY_ENABLED; Tools / Experiences from finalized traces

cache:
  enabled: true                  # [all]
  max_size: 1000                 # [all]

# ---- M3 long-video benchmark [all] ----
# Configuration for the M3 episodic-memory pipeline. ``embedding``
# overrides the top-level block for M3 retrieval; ``vector_index``
# configures the dedicated OpenGaussVectorIndex that backs
# ``GraphService.search_by_embedding`` so QA can push the
# ``ClipScope`` filter down to SQL instead of scanning JSONB.
# The vector-index connection string is inherited from the
# top-level ``vector_db.connection_string`` — no separate
# ``m3.vector_index.connection_string`` key exists.
m3:
  embedding:
    provider: openai              # [all]
    model: "BAAI/bge-large-zh-v1.5"  # [all]
    base_url: null                # [all]
    api_key: null                 # [all]
    dimension: 1024               # [all]
  vector_index:
    backend: opengauss            # [all] openGauss is still the recommended production target; ``pgvector`` is the convenience alias for PostgreSQL+pgvector deployments that want to share one DB
    table_name: m3_episodic_vectors  # [all] partition by run if you share a DB
    pool_size: 5                  # [all]
