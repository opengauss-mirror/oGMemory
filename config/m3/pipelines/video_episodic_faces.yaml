name: video_episodic_faces
version: 1
description: Vision-only one-video episodic memory pipeline with face detection enabled

artifacts:
  selected_video: "{work_dir}/videos/robot/{video_id}.mp4"
  annotations: "{work_dir}/annotations/one_video.json"
  clips_root: "{work_dir}/clips"
  frames_root: "{work_dir}/frames"
  audio_root: "{work_dir}/audio"
  data_jsonl: "{work_dir}/data.jsonl"
  frames_jsonl: "{work_dir}/frames.jsonl"
  audio_jsonl: "{work_dir}/audio.jsonl"
  faces_jsonl: "{work_dir}/faces.jsonl"
  face_clusters: "{work_dir}/face_clusters.jsonl"
  voice_segments: "{work_dir}/voice_segments.jsonl"
  voice_clusters: "{work_dir}/voice_clusters.jsonl"
  semantic_memories: "{work_dir}/semantic_memories.jsonl"
  episodic_jsonl: "{work_dir}/episodic_memory.jsonl"
  index_jsonl: "{work_dir}/episodic_index.jsonl"
  summary_json: "{work_dir}/pipeline_summary.json"

stages:
  - id: trim
    type: video.trim
    params:
      seconds: "{seconds}"

  - id: annotate
    type: m3.write_single_annotation
    needs: [trim]

  - id: preprocess
    type: m3.preprocess
    needs: [annotate]
    params:
      clip_seconds: 30

  - id: load_clips
    type: m3.load_clips
    needs: [preprocess]
    params:
      clip_seconds: 30

  # Runs after load_clips (needs VIDEO RawNodes) and before
  # episodic_memory (which walks the graph for AUDIO children).
  # Disabled by default — vision-only runs skip the ffmpeg cost.
  # Enable with `--enable-stage extract_audio` to the orchestrator.
  - id: extract_audio
    type: m3.extract_audio
    enabled: true
    needs: [load_clips]
    params:
      sample_rate: 16000
      channels: 1


  - id: extract_frames
    type: m3.extract_frames
    needs: [load_clips]
    params:
      fps: 1
      max_frames: 8
      resize: 512
      jpeg_quality: 80
      keyframes_only: false

  - id: detect_faces
    type: m3.detect_faces
    enabled: true
    needs: [extract_frames]
    params:
      backend: http
      min_confidence: 0.5
      max_faces: 20

  - id: episodic_memory
    type: m3.episodic_memory
    needs: [extract_frames, extract_audio]
    params:
      max_frames: 8

  - id: create_memory_nodes
    type: m3.memory.from_episodic
    needs: [episodic_memory]

  - id: build_index
    type: m3.index_episodic
    enabled: false
    needs: [episodic_memory]

  # Cross-clip face identity clustering. Walks the graph, finds
  # faces within the cosine-distance threshold, and emits
  # same_identity edges between the cluster anchor and each member.
  # Disabled by default — single-video runs produce no cross-clip
  # clusters. Enable for cross-video evaluations.
  - id: face_clustering
    type: m3.face_clustering
    enabled: false
    needs: [detect_faces]
    params:
      threshold: 0.4

  # Voice activity detection on every AUDIO RawNode. Each detected
  # voice run becomes an ExtractedNode child (start/end/voice_id
  # + voice_embedding). Disabled by default — small per-clip cost
  # even for vision-only runs. Enable alongside episodic_memory to
  # feed audio segments into the episodic description.
  - id: voice_segmentation
    type: m3.voice_segmentation
    enabled: false
    needs: [extract_audio]
    params:
      energy_threshold_dbfs: -40.0
      min_segment_sec: 0.25
      max_segment_sec: 30.0
      pad_sec: 0.1

  # Cross-clip voice identity clustering. Walks the graph for every
  # voice_segmentation ExtractedNode with a voice_embedding and
  # emits same_identity edges between cluster anchor and members.
  # Disabled by default — single-video runs produce no cross-clip
  # clusters. Enable for cross-video evaluations.
  - id: voice_clustering
    type: m3.voice_clustering
    enabled: false
    needs: [voice_segmentation]
    params:
      threshold: 0.3

  # Per-video consolidation of episodic_memory_generator nodes into
  # a single MemoryNode (merged description + characters / events /
  # entities). Each source EpisrictedNode gets an EVOLVES edge to
  # the consolidated MemoryNode. Useful for "General Knowledge"
  # M3-Bench question buckets that span clips.
  - id: semantic_memory_consolidator
    type: m3.semantic_memory_consolidator
    enabled: false
    needs: [episodic_memory]
    params: {}
